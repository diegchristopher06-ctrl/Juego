<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de los Vasos - 10 Niveles</title>
    <!-- Carga de Tailwind CSS para un diseño moderno y fluido sin necesidad de escribir CSS pesado desde cero -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none; /* Desactiva la selección de texto para evitar distracciones al hacer clic */
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        /* Estilo para el fondo simulando la textura y ambiente de una mesa de juego */
        .table-mat {
            background: radial-gradient(ellipse at center, #1e293b 0%, #0f172a 80%);
            border: 10px solid #334155;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 0 60px rgba(0, 0, 0, 0.8);
        }

        /* Ajuste fino para interacción táctil en pantallas móviles */
        canvas {
            touch-action: none;
        }

        /* Barra de scroll personalizada para la navegación horizontal de 10 niveles */
        .level-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .level-scroll::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between p-2 sm:p-4">

    <!-- Encabezado principal: Nombre del juego, racha actual y control de sonido -->
    <header class="w-full max-w-4xl flex flex-wrap justify-between items-center bg-slate-900/90 border border-slate-800 p-3 sm:p-4 rounded-2xl shadow-xl backdrop-blur-md mb-3 gap-2">
        <div class="flex items-center gap-3">
            <div class="bg-amber-500/20 border border-amber-500/40 p-2 rounded-xl text-amber-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <div>
                <h1 class="font-extrabold text-lg sm:text-xl text-amber-400 tracking-wide">La Piedra Oculta</h1>
                <p class="text-xs text-slate-400" id="level-title">Nivel 1: Principiante</p>
            </div>
        </div>

        <div class="flex items-center gap-4 sm:gap-6 text-xs sm:text-sm">
            <div class="text-center">
                <span class="block text-slate-400 text-xs uppercase tracking-wider">Racha</span>
                <span class="font-bold text-amber-400 text-base sm:text-lg" id="streak-count">0</span>
            </div>
            <div class="text-center">
                <span class="block text-slate-400 text-xs uppercase tracking-wider">Máx Racha</span>
                <span class="font-bold text-emerald-400 text-base sm:text-lg" id="best-streak">0</span>
            </div>
            <button id="sound-btn" class="p-2.5 bg-slate-800 hover:bg-slate-700 active:scale-95 rounded-xl border border-slate-700 transition" title="Activar/Desactivar Sonido">
                <svg id="sound-icon-on" class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                <svg id="sound-icon-off" class="w-5 h-5 text-slate-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
            </button>
        </div>
    </header>

    <!-- Barra de selección de los 10 Niveles con desplazamiento horizontal -->
    <div class="w-full max-w-4xl flex items-center justify-start gap-2 mb-3 bg-slate-900/60 p-2 rounded-2xl border border-slate-800/80 overflow-x-auto level-scroll">
        <!-- Los botones de nivel 1 al 10 se generan dinámicamente o se configuran vía JS -->
        <div id="level-buttons-container" class="flex gap-2 min-w-full"></div>
    </div>

    <!-- Zona Principal del juego: Canvas y modales -->
    <main class="relative w-full max-w-4xl flex-1 flex flex-col justify-center items-center">
        <div class="table-mat relative w-full h-[380px] sm:h-[460px] rounded-3xl overflow-hidden flex items-center justify-center">
            
            <!-- Lienzo HTML5 Canvas donde renderizamos los vasos y la piedra -->
            <canvas id="gameCanvas" class="w-full h-full cursor-pointer"></canvas>

            <!-- Banner informativo con las instrucciones actuales para el jugador -->
            <div id="status-banner" class="absolute top-4 left-1/2 -translate-x-1/2 bg-slate-950/85 border border-amber-500/40 backdrop-blur-md px-6 py-2 rounded-full text-xs sm:text-sm font-semibold text-amber-300 shadow-xl transition-all duration-300 text-center pointer-events-none z-10">
                Presiona "¡Iniciar Mezcla!" para ver la piedra
            </div>

            <!-- Ventana emergente (Modal) al terminar un intento (Victoria / Derrota) -->
            <div id="result-modal" class="hidden absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20 animate-fade-in">
                <div id="modal-icon-container" class="mb-3 p-4 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">
                    <svg id="success-icon" class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    <svg id="fail-icon" class="w-12 h-12 hidden text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </div>
                <h2 id="result-title" class="text-2xl sm:text-3xl font-extrabold text-white mb-2">¡Correcto!</h2>
                <p id="result-desc" class="text-sm text-slate-300 max-w-md mb-6">¡Has mantenido la vista fija en la piedra perfectamente!</p>
                
                <div class="flex flex-wrap justify-center gap-3">
                    <button id="retry-btn" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm rounded-xl border border-slate-600 transition active:scale-95 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        Repetir Nivel
                    </button>
                    <button id="next-btn" class="px-6 py-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-extrabold text-sm rounded-xl shadow-lg transition active:scale-95 flex items-center gap-2">
                        Siguiente Nivel
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Botón inferior para arrancar la partida -->
    <footer class="w-full max-w-4xl mt-3 flex justify-center">
        <button id="start-btn" class="w-full sm:w-auto px-12 py-3.5 bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 hover:from-amber-400 hover:to-amber-300 text-slate-950 font-black text-base uppercase tracking-wider rounded-2xl shadow-xl shadow-amber-500/20 active:scale-95 transition-all">
            ¡Iniciar Mezcla!
        </button>
    </footer>

    <script>
        /* ==========================================================================
           MÓDULO DE AUDIO SINTETIZADO (Web Audio API)
           --------------------------------------------------------------------------
           Genera efectos de sonido mediante ondas matemáticas puras (Osciladores),
           evitando la necesidad de cargar archivos externos MP3 o WAV.
           ========================================================================== */
        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            // Inicializa el contexto de audio tras el primer clic del usuario (política de navegadores)
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }

            // Efecto al levantar el vaso (un tono en rampa ascendente)
            playLift() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(450, this.ctx.currentTime + 0.18);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.18);
            }

            // Efecto sutil para el deslizamiento rápido de vasos
            playSwap() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            // Melodía corta de victoria
            playWin() {
                if (this.muted || !this.ctx) return;
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.08);
                    osc.stop(this.ctx.currentTime + idx * 0.08 + 0.3);
                });
            }

            // Tono grave disonante para derrota
            playLose() {
                if (this.muted || !this.ctx) return;
                const notes = [280, 240, 200, 160];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.1 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.1);
                    osc.stop(this.ctx.currentTime + idx * 0.1 + 0.2);
                });
            }
        }

        const sounds = new SoundEffects();
    </script>

    <script>
        /* ==========================================================================
           CONFIGURACIÓN DE NIVELES Y VARIABLES DE ESTADO
           --------------------------------------------------------------------------
           10 Niveles con velocidad creciente (ms por intercambio más bajos) y
           mayor cantidad de vasos para un desafío visual alto.
           ========================================================================== */
        const LEVEL_CONFIGS = {
            1:  { cups: 3,  speed: 650, swaps: 5,  name: "Nivel 1: Principiante" },
            2:  { cups: 3,  speed: 520, swaps: 7,  name: "Nivel 2: Iniciado" },
            3:  { cups: 4,  speed: 430, swaps: 9,  name: "Nivel 3: Aficionado" },
            4:  { cups: 4,  speed: 340, swaps: 12, name: "Nivel 4: Intermedio" },
            5:  { cups: 5,  speed: 270, swaps: 15, name: "Nivel 5: Avanzado" },
            6:  { cups: 5,  speed: 210, swaps: 18, name: "Nivel 6: Profesional" },
            7:  { cups: 6,  speed: 170, swaps: 22, name: "Nivel 7: Experto" },
            8:  { cups: 7,  speed: 140, swaps: 26, name: "Nivel 8: Maestro" },
            9:  { cups: 8,  speed: 115, swaps: 30, name: "Nivel 9: Leyenda" },
            10: { cups: 9,  speed: 90,  swaps: 35, name: "Nivel 10: Imposible" }
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Variables de estado del juego
        let currentLevel = 1;
        let gameState = 'IDLE'; // Estados: 'IDLE', 'SHOWING', 'SHUFFLING', 'GUESSING', 'RESULT'
        let cups = [];
        let stoneIndex = 0;     // Posición real del vaso que contiene la piedra
        let swapQueue = [];      // Cola con la secuencia aleatoria de intercambios
        let streak = 0;
        let bestStreak = 0;

        // Variables para controlar la animación del intercambio actual
        let activeSwap = null; 
        let slotPositions = []; // Mapeo de coordenadas X para cada ranura de la mesa

        /* ==========================================================================
           CLASE CUP (Vasos)
           --------------------------------------------------------------------------
           Maneja el dibujo, la elevación y las coordenadas de cada vaso.
           ========================================================================== */
        class Cup {
            constructor(id) {
                this.id = id;
                this.x = 0;
                this.y = 0;
                this.liftY = 0; // Desplazamiento vertical cuando el vaso se destapa
            }

            draw(ctx, width) {
                // Cálculo dinámico del tamaño del vaso para ajustarse horizontalmente según la cantidad
                const numCups = cups.length;
                const cupWidth = Math.min(width / (numCups + 1.2), 85);
                const cupHeight = cupWidth * 1.25;
                const drawY = this.y - this.liftY;

                ctx.save();
                ctx.translate(this.x, drawY);

                // 1. Sombra sobre la mesa (disminuye en opacidad si el vaso se eleva)
                ctx.beginPath();
                const shadowY = this.y + cupHeight / 2 - drawY;
                const shadowAlpha = Math.max(0.05, 0.35 - (this.liftY / 250));
                ctx.ellipse(0, shadowY, (cupWidth / 2) * (1 + this.liftY / 300), 10, 0, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 0, 0, ${shadowAlpha})`;
                ctx.fill();

                // 2. Gradiente metálico rojo/naranja elegante para el vaso
                const grad = ctx.createLinearGradient(-cupWidth / 2, 0, cupWidth / 2, 0);
                grad.addColorStop(0, '#9a3412');
                grad.addColorStop(0.3, '#ea580c');
                grad.addColorStop(0.7, '#f97316');
                grad.addColorStop(1, '#7c2d12');

                // 3. Dibujo de la geometría trapezoidal del vaso
                ctx.beginPath();
                ctx.moveTo(-cupWidth / 2 * 0.72, -cupHeight / 2);
                ctx.lineTo(cupWidth / 2 * 0.72, -cupHeight / 2);
                ctx.lineTo(cupWidth / 2, cupHeight / 2 - 6);
                ctx.quadraticCurveTo(cupWidth / 2, cupHeight / 2, cupWidth / 2 - 6, cupHeight / 2);
                ctx.lineTo(-cupWidth / 2 + 6, cupHeight / 2);
                ctx.quadraticCurveTo(-cupWidth / 2, cupHeight / 2, -cupWidth / 2, cupHeight / 2 - 6);
                ctx.closePath();

                ctx.fillStyle = grad;
                ctx.fill();

                // Borde exterior
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#c2410c';
                ctx.stroke();

                // Detalle superior del vaso
                ctx.beginPath();
                ctx.ellipse(0, -cupHeight / 2, cupWidth / 2 * 0.72, 5, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#ffedd5';
                ctx.fill();

                ctx.restore();
            }

            // Devuelve el área de interacción para detectar clics en la pantalla
            getBounds(width) {
                const cupWidth = Math.min(width / (cups.length + 1.2), 85);
                const cupHeight = cupWidth * 1.25;
                return {
                    left: this.x - cupWidth / 2,
                    right: this.x + cupWidth / 2,
                    top: this.y - cupHeight / 2 - this.liftY,
                    bottom: this.y + cupHeight / 2
                };
            }
        }

        /* ==========================================================================
           DIBUJO DE LA PIEDRA (MATE SIN BRILLOS)
           --------------------------------------------------------------------------
           Diseñada intencionalmente con tonos grises y sombras suaves sin destellos
           ni resplandores neón para evitar ventajas de rastreo.
           ========================================================================== */
        function drawStone(x, y, width) {
            const cupWidth = Math.min(width / (cups.length + 1.2), 85);
            const radius = Math.max(10, cupWidth * 0.20);

            ctx.save();
            ctx.translate(x, y + cupWidth * 0.38);

            // Sombra leve de la piedra
            ctx.beginPath();
            ctx.ellipse(0, radius * 0.5, radius * 0.9, radius * 0.3, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fill();

            // Gradiente sobrio estilo piedra rugosa/mate
            const stoneGrad = ctx.createRadialGradient(-radius * 0.2, -radius * 0.2, 1, 0, 0, radius);
            stoneGrad.addColorStop(0, '#78716c'); // Gris piedra claro
            stoneGrad.addColorStop(0.5, '#57534e'); // Gris piedra medio
            stoneGrad.addColorStop(1, '#292524'); // Gris oscuro

            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = stoneGrad;
            ctx.fill();

            // Textura sutil y contorno apagado
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#1c1917';
            ctx.stroke();

            ctx.restore();
        }

        /* ==========================================================================
           LÓGICA DE DIMENSIONAMIENTO RESPONSIVO
           --------------------------------------------------------------------------
           Ajusta dinámicamente las coordenadas y tamaños de los elementos en el
           canvas al cambiar el tamaño de la ventana o del dispositivo.
           ========================================================================== */
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            const config = LEVEL_CONFIGS[currentLevel];
            const numCups = config.cups;
            const spacing = canvas.width / (numCups + 1);
            
            slotPositions = [];
            for (let i = 0; i < numCups; i++) {
                slotPositions.push((i + 1) * spacing);
            }

            // Recolocar los vasos en sus posiciones fijas si no hay animación activa
            if (cups.length === numCups && !activeSwap) {
                cups.forEach((cup, idx) => {
                    cup.x = slotPositions[idx];
                    cup.y = canvas.height * 0.62;
                });
            }
        }

        // Genera visualmente los 10 botones de nivel en la barra superior
        function buildLevelButtons() {
            const container = document.getElementById('level-buttons-container');
            container.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const conf = LEVEL_CONFIGS[i];
                const btn = document.createElement('button');
                btn.dataset.level = i;
                btn.className = `level-btn flex-1 min-w-[75px] py-1.5 px-2 text-center rounded-xl font-bold text-xs transition border ${
                    i === currentLevel 
                    ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-md' 
                    : 'bg-slate-800/80 text-slate-400 border-slate-700/60 hover:bg-slate-700'
                }`;
                btn.innerHTML = `Nivel ${i}<span class="block text-[9px] font-normal opacity-80">${conf.cups} Vasos</span>`;
                btn.onclick = () => {
                    if (gameState === 'SHUFFLING' || gameState === 'SHOWING') return;
                    initLevel(i);
                };
                container.appendChild(btn);
            }
        }

        // Inicializa un nivel específico
        function initLevel(level) {
            currentLevel = level;
            const config = LEVEL_CONFIGS[level];
            
            cups = [];
            for (let i = 0; i < config.cups; i++) {
                cups.push(new Cup(i));
            }

            // Seleccionar aleatoriamente qué vaso albergará la piedra
            stoneIndex = Math.floor(Math.random() * config.cups);

            // Actualizar interfaz
            document.getElementById('level-title').textContent = config.name;
            buildLevelButtons();

            gameState = 'IDLE';
            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('start-btn').disabled = false;
            document.getElementById('start-btn').classList.remove('opacity-50', 'cursor-not-allowed');
            updateStatusBanner('Presiona "¡Iniciar Mezcla!" para ver la piedra');

            resizeCanvas();
        }

        function updateStatusBanner(text) {
            document.getElementById('status-banner').textContent = text;
        }

        // Genera la secuencia aleatoria de intercambios entre vasos
        function generateSwapQueue() {
            const config = LEVEL_CONFIGS[currentLevel];
            const queue = [];
            let lastA = -1, lastB = -1;

            for (let i = 0; i < config.swaps; i++) {
                let idxA, idxB;
                do {
                    idxA = Math.floor(Math.random() * config.cups);
                    idxB = Math.floor(Math.random() * config.cups);
                } while (idxA === idxB || (idxA === lastA && idxB === lastB) || (idxA === lastB && idxB === lastA));

                lastA = idxA;
                lastB = idxB;
                queue.push([idxA, idxB]);
            }
            return queue;
        }

        // Inicia el juego (muestra la piedra primero y luego comienza la mezcla)
        function startGame() {
            if (gameState !== 'IDLE') return;

            sounds.init();
            gameState = 'SHOWING';
            document.getElementById('start-btn').disabled = true;
            document.getElementById('start-btn').classList.add('opacity-50', 'cursor-not-allowed');

            updateStatusBanner('¡Memoriza la posición de la piedra!');

            // Animación para revelar la piedra levantando el vaso
            const targetCup = cups[stoneIndex];
            sounds.playLift();

            let startTime = null;
            const liftDuration = 550;
            const holdDuration = 900;

            function animateLift(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (elapsed < liftDuration) {
                    targetCup.liftY = (elapsed / liftDuration) * 75;
                    requestAnimationFrame(animateLift);
                } else if (elapsed < liftDuration + holdDuration) {
                    targetCup.liftY = 75;
                    requestAnimationFrame(animateLift);
                } else if (elapsed < liftDuration * 2 + holdDuration) {
                    const dropProgress = (elapsed - liftDuration - holdDuration) / liftDuration;
                    targetCup.liftY = 75 * (1 - dropProgress);
                    requestAnimationFrame(animateLift);
                } else {
                    targetCup.liftY = 0;
                    startShuffle();
                }
            }

            requestAnimationFrame(animateLift);
        }

        /* ==========================================================================
           LÓGICA DE MEZCLA CON ARCOS 3D E INTERPOLACIÓN MATEMÁTICA
           --------------------------------------------------------------------------
           Ejecuta los intercambios calculando posiciones con funciones de onda
           senoidal para simular que un vaso pasa por enfrente y el otro por detrás.
           ========================================================================== */
        function startShuffle() {
            gameState = 'SHUFFLING';
            updateStatusBanner('¡Mezclando vasos! Sigue la piedra con la mirada');
            swapQueue = generateSwapQueue();
            executeNextSwap();
        }

        function executeNextSwap() {
            if (swapQueue.length === 0) {
                gameState = 'GUESSING';
                updateStatusBanner('¡¿Dónde está la piedra?! Haz clic sobre un vaso');
                return;
            }

            const [idxA, idxB] = swapQueue.shift();
            const cupA = cups[idxA];
            const cupB = cups[idxB];
            const config = LEVEL_CONFIGS[currentLevel];

            // Si el intercambio involucra al vaso que contiene la piedra, actualizamos la referencia interna
            if (stoneIndex === idxA) stoneIndex = idxB;
            else if (stoneIndex === idxB) stoneIndex = idxA;

            // Reordenamos el array de vasos
            cups[idxA] = cupB;
            cups[idxB] = cupA;

            sounds.playSwap();

            activeSwap = {
                cupA: cupA,
                cupB: cupB,
                startX_A: cupA.x,
                startX_B: cupB.x,
                targetX_A: slotPositions[idxB],
                targetX_B: slotPositions[idxA],
                startTime: performance.now(),
                duration: config.speed
            };

            requestAnimationFrame(animateSwapStep);
        }

        function animateSwapStep(now) {
            if (!activeSwap) return;

            const elapsed = now - activeSwap.startTime;
            const progress = Math.min(elapsed / activeSwap.duration, 1.0);

            // Interpolación Suave Cosinusoidal (Easing Ease-In-Out)
            const ease = 0.5 - Math.cos(progress * Math.PI) / 2;

            // Posición X
            activeSwap.cupA.x = activeSwap.startX_A + (activeSwap.targetX_A - activeSwap.startX_A) * ease;
            activeSwap.cupB.x = activeSwap.startX_B + (activeSwap.targetX_B - activeSwap.startX_B) * ease;

            // Curva de Arco Vertical (Simula profundidad 3D)
            const arcHeight = 30 * Math.sin(progress * Math.PI);
            activeSwap.cupA.y = (canvas.height * 0.62) - arcHeight;
            activeSwap.cupB.y = (canvas.height * 0.62) + (arcHeight * 0.5);

            if (progress < 1.0) {
                requestAnimationFrame(animateSwapStep);
            } else {
                // Final de este paso de intercambio
                activeSwap.cupA.x = activeSwap.targetX_A;
                activeSwap.cupB.x = activeSwap.targetX_B;
                activeSwap.cupA.y = canvas.height * 0.62;
                activeSwap.cupB.y = canvas.height * 0.62;
                activeSwap = null;

                executeNextSwap();
            }
        }

        /* ==========================================================================
           BUCLE DE RENDERIZADO PRINCIPAL (60 FPS / RequestAnimationFrame)
           ========================================================================== */
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Renderizar la piedra
            if (cups[stoneIndex]) {
                drawStone(cups[stoneIndex].x, cups[stoneIndex].y, canvas.width);
            }

            // Renderizar los vasos
            cups.forEach(cup => cup.draw(ctx, canvas.width));

            requestAnimationFrame(render);
        }

        // Manejo de clics/toques sobre los vasos para adivinar
        function handleCanvasClick(e) {
            if (gameState !== 'GUESSING') return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            for (let i = 0; i < cups.length; i++) {
                const bounds = cups[i].getBounds(canvas.width);
                if (clickX >= bounds.left && clickX <= bounds.right && clickY >= bounds.top && clickY <= bounds.bottom) {
                    processGuess(i);
                    break;
                }
            }
        }

        // Procesa la elección del jugador
        function processGuess(selectedIndex) {
            gameState = 'RESULT';
            sounds.init();

            const isCorrect = (selectedIndex === stoneIndex);
            const selectedCup = cups[selectedIndex];
            const realStoneCup = cups[stoneIndex];

            sounds.playLift();

            let startTime = null;
            function animateReveal(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (elapsed < 450) {
                    selectedCup.liftY = (elapsed / 450) * 75;
                    if (!isCorrect && elapsed > 200) {
                        realStoneCup.liftY = ((elapsed - 200) / 250) * 75;
                    }
                    requestAnimationFrame(animateReveal);
                } else {
                    selectedCup.liftY = 75;
                    if (!isCorrect) realStoneCup.liftY = 75;
                    showResultModal(isCorrect);
                }
            }

            requestAnimationFrame(animateReveal);
        }

        // Muestra el panel de resultados
        function showResultModal(isWin) {
            const modal = document.getElementById('result-modal');
            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            const successIcon = document.getElementById('success-icon');
            const failIcon = document.getElementById('fail-icon');
            const iconContainer = document.getElementById('modal-icon-container');
            const nextBtn = document.getElementById('next-btn');

            modal.classList.remove('hidden');

            if (isWin) {
                sounds.playWin();
                title.textContent = "¡Excelente Vista!";
                title.className = "text-2xl sm:text-3xl font-extrabold text-emerald-400 mb-2";
                desc.textContent = `¡Adivinaste correctamente en el Nivel ${currentLevel}!`;
                
                successIcon.classList.remove('hidden');
                failIcon.classList.add('hidden');
                iconContainer.className = "mb-3 p-4 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40";

                streak++;
                if (streak > bestStreak) bestStreak = streak;

                if (currentLevel < 10) {
                    nextBtn.classList.remove('hidden');
                } else {
                    nextBtn.classList.add('hidden');
                    desc.textContent = "¡ENHORABUENA! Has completado los 10 Niveles del Juego.";
                }
            } else {
                sounds.playLose();
                title.textContent = "¡Te equivocaste!";
                title.className = "text-2xl sm:text-3xl font-extrabold text-rose-400 mb-2";
                desc.textContent = "La velocidad te ha confundido. ¡Inténtalo de nuevo!";
                
                successIcon.classList.add('hidden');
                failIcon.classList.remove('hidden');
                iconContainer.className = "mb-3 p-4 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/40";

                streak = 0;
                nextBtn.classList.add('hidden');
            }

            document.getElementById('streak-count').textContent = streak;
            document.getElementById('best-streak').textContent = bestStreak;
        }

        // Listeners de eventos de usuario e interfaz
        window.addEventListener('resize', resizeCanvas);
        canvas.addEventListener('click', handleCanvasClick);

        document.getElementById('start-btn').addEventListener('click', startGame);

        document.getElementById('retry-btn').addEventListener('click', () => {
            initLevel(currentLevel);
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentLevel < 10) {
                initLevel(currentLevel + 1);
            }
        });

        document.getElementById('sound-btn').addEventListener('click', () => {
            sounds.muted = !sounds.muted;
            document.getElementById('sound-icon-on').classList.toggle('hidden', sounds.muted);
            document.getElementById('sound-icon-off').classList.toggle('hidden', !sounds.muted);
        });

        // Arranque inicial cuando la página carga por completo
        window.onload = () => {
            initLevel(1);
            requestAnimationFrame(render);
        };
    </script>
</body>
</html>
