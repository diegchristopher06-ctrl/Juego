            -webkit-user-select: none;

        <button data-level="2" class="level-btn flex-1 min-w-[70px] py-2 px-1 text-center rounded-xl font-bold text-xs sm:text-sm transition bg-zinc-800 text-zinc-400 hover:bg-zinc-700">Nivel 2<span class="block text-[10px] font-normal opacity-80">4 Vasos</span></button>

            <div id="result-modal" class="hidden absolute inset-0 bg-zinc-950/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-20 animate-fade-in">

                </div>

                <div class="flex flex-wrap justify-center gap-3">
                    <button id="retry-btn" class="px-6 py-3 bg-zinc-800 hover:bg-zinc-700 text-white font-bold text-sm rounded-xl border border-zinc-600 transition active:scale-95 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        Repetir Nivel
                    </button>
                    <button id="next-btn" class="px-6 py-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-zinc-950 font-extrabold text-sm rounded-xl shadow-lg transition active:scale-95 flex items-center gap-2">
                        Siguiente Nivel
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>

                </div>

        </div>
    </main>

    <footer class="w-full max-w-4xl mt-3 flex justify-center">
        <button id="start-btn" class="w-full sm:w-auto px-10 py-3.5 bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 hover:from-amber-400 hover:to-amber-300 text-zinc-950 font-black text-base uppercase tracking-wider rounded-2xl shadow-xl shadow-amber-500/20 active:scale-95 transition-all">
            ¡Iniciar Mezcla!
        </button>
    </footer>

    <script>
        // Sistema de audio sintetizado con Web Audio API para no depender de archivos externos
        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }

            playLift() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(450, this.ctx.currentTime + 0.18);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.18);
            }

            playSwap() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playWin() {
                if (this.muted || !this.ctx) return;
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.08);
                    osc.stop(this.ctx.currentTime + idx * 0.08 + 0.3);
                });
            }

            playLose() {
                if (this.muted || !this.ctx) return;
                const notes = [300, 260, 220, 180];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.1 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.1);
                    osc.stop(this.ctx.currentTime + idx * 0.1 + 0.2);
                });
            }
        }

        const sounds = new SoundEffects();
    </script>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Configuración de los 5 Niveles
        const LEVEL_CONFIGS = {
            1: { cups: 3, speed: 650, swaps: 5, name: "Nivel 1: Principiante" },
            2: { cups: 4, speed: 500, swaps: 8, name: "Nivel 2: Aficionado" },
            3: { cups: 5, speed: 380, swaps: 11, name: "Nivel 3: Avanzado" },
            4: { cups: 6, speed: 280, swaps: 14, name: "Nivel 4: Experto" },
            5: { cups: 7, speed: 190, swaps: 18, name: "Nivel 5: Maestro" }
        };

        // Estado Global del Juego
        let currentLevel = 1;
        let gameState = 'IDLE'; // 'IDLE', 'SHOWING', 'SHUFFLING', 'GUESSING', 'RESULT'
        let cups = [];
        let stoneIndex = 0; // Índice de la posición del vaso que tiene la piedra
        let currentSwapIndex = 0;
        let swapQueue = [];
        let streak = 0;
        let bestStreak = 0;

        // Variables de Animación de Intercambio
        let activeSwap = null; // { cupA, cupB, startTime, duration, arcDirection }

        // Mapeo de Posiciones de los Vasos
        let slotPositions = [];

        class Cup {
            constructor(id) {
                this.id = id;
                this.x = 0;
                this.y = 0;
                this.liftY = 0; // Para animación de destape / levantar
                this.scale = 1.0;
                this.isHighlighted = false;
            }

            draw(ctx, width, height) {
                const cupWidth = Math.min(width / (cups.length + 1.2), 95);
                const cupHeight = cupWidth * 1.25;
                const drawY = this.y - this.liftY;

                ctx.save();
                ctx.translate(this.x, drawY);

                // Sombra del vaso en la mesa
                ctx.beginPath();
                const shadowY = this.y + cupHeight / 2 - drawY;
                const shadowAlpha = Math.max(0.05, 0.35 - (this.liftY / 250));
                ctx.ellipse(0, shadowY, (cupWidth / 2) * (1 + this.liftY / 300), 12, 0, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 0, 0, ${shadowAlpha})`;
                ctx.fill();

                // Cuerpo del Vaso (Gradiente Metálico / Neón Pulido)
                const grad = ctx.createLinearGradient(-cupWidth / 2, 0, cupWidth / 2, 0);
                grad.addColorStop(0, '#c2410c');
                grad.addColorStop(0.3, '#f97316');
                grad.addColorStop(0.6, '#fb923c');
                grad.addColorStop(1, '#9a3412');

                // Forma Trapezoidal del Vaso
                ctx.beginPath();
                ctx.moveTo(-cupWidth / 2 * 0.72, -cupHeight / 2); // Borde superior
                ctx.lineTo(cupWidth / 2 * 0.72, -cupHeight / 2);
                ctx.lineTo(cupWidth / 2, cupHeight / 2 - 8);     // Borde inferior
                ctx.quadraticCurveTo(cupWidth / 2, cupHeight / 2, cupWidth / 2 - 8, cupHeight / 2);
                ctx.lineTo(-cupWidth / 2 + 8, cupHeight / 2);
                ctx.quadraticCurveTo(-cupWidth / 2, cupHeight / 2, -cupWidth / 2, cupHeight / 2 - 8);
                ctx.closePath();

                ctx.fillStyle = grad;
                ctx.fill();

                // Borde de adorno / Anillos del Vaso
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ea580c';
                ctx.stroke();

                // Brillo especular superior
                ctx.beginPath();
                ctx.ellipse(0, -cupHeight / 2, cupWidth / 2 * 0.72, 6, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#ffedd5';
                ctx.fill();

                // Anillo inferior de la base
                ctx.beginPath();
                ctx.ellipse(0, cupHeight / 2 - 4, cupWidth / 2 - 4, 5, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.fill();

                // Resplandor si está seleccionado
                if (this.isHighlighted) {
                    ctx.strokeStyle = '#f59e0b';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                }

                ctx.restore();
            }

            // Devuelve el área interactiva (Bounding Box)
            getBounds(width) {
                const cupWidth = Math.min(width / (cups.length + 1.2), 95);
                const cupHeight = cupWidth * 1.25;
                return {
                    left: this.x - cupWidth / 2,
                    right: this.x + cupWidth / 2,
                    top: this.y - cupHeight / 2 - this.liftY,
                    bottom: this.y + cupHeight / 2
                };
            }
        }

        function drawStone(x, y, width) {
            const cupWidth = Math.min(width / (cups.length + 1.2), 95);
            const radius = Math.max(12, cupWidth * 0.22);

            ctx.save();
            ctx.translate(x, y + cupWidth * 0.4);

            // Sombra de la piedra
            ctx.beginPath();
            ctx.ellipse(0, radius * 0.6, radius, radius * 0.35, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fill();

            // Resplandor de la piedra
            const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, radius * 2);
            glow.addColorStop(0, 'rgba(59, 130, 246, 0.6)');
            glow.addColorStop(1, 'rgba(59, 130, 246, 0)');
            ctx.beginPath();
            ctx.arc(0, 0, radius * 2, 0, Math.PI * 2);
            ctx.fillStyle = glow;
            ctx.fill();

            // Cuerpo Facetado de la Piedra (Gema Azul)
            const stoneGrad = ctx.createRadialGradient(-radius * 0.3, -radius * 0.3, 2, 0, 0, radius);
            stoneGrad.addColorStop(0, '#93c5fd');
            stoneGrad.addColorStop(0.4, '#3b82f6');
            stoneGrad.addColorStop(0.8, '#1d4ed8');
            stoneGrad.addColorStop(1, '#1e3a8a');

            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = stoneGrad;
            ctx.fill();

            // Brillo blanco cristalino
            ctx.beginPath();
            ctx.ellipse(-radius * 0.35, -radius * 0.35, radius * 0.3, radius * 0.18, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.fill();

            ctx.restore();
        }

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            const config = LEVEL_CONFIGS[currentLevel];
            const numCups = config.cups;
            const spacing = canvas.width / (numCups + 1);
            
            slotPositions = [];
            for (let i = 0; i < numCups; i++) {
                slotPositions.push((i + 1) * spacing);
            }

            // Reposicionar vasos instantáneamente si no se están animando
            if (cups.length === numCups && !activeSwap) {
                cups.forEach((cup, idx) => {
                    cup.x = slotPositions[idx];
                    cup.y = canvas.height * 0.62;
                });
            }
        }

        // Initialize Level Cups Structure
        function initLevel(level) {
            currentLevel = level;
            const config = LEVEL_CONFIGS[level];
            
            cups = [];
            for (let i = 0; i < config.cups; i++) {
                cups.push(new Cup(i));
            }

            // Asignar aleatoriamente la piedra a un vaso
            stoneIndex = Math.floor(Math.random() * config.cups);

            // Actualizar interfaz
            document.getElementById('level-title').textContent = config.name;
            document.querySelectorAll('.level-btn').forEach(btn => {
                const btnLevel = parseInt(btn.dataset.level);
                if (btnLevel === level) {
                    btn.className = "level-btn flex-1 min-w-[70px] py-2 px-1 text-center rounded-xl font-bold text-xs sm:text-sm transition bg-amber-500 text-zinc-950 shadow-md";
                } else {
                    btn.className = "level-btn flex-1 min-w-[70px] py-2 px-1 text-center rounded-xl font-bold text-xs sm:text-sm transition bg-zinc-800 text-zinc-400 hover:bg-zinc-700";
                }
            });

            gameState = 'IDLE';
            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('start-btn').disabled = false;
            document.getElementById('start-btn').classList.remove('opacity-50', 'cursor-not-allowed');
            updateStatusBanner('Presiona "¡Iniciar Mezcla!" para ver dónde está la piedra');

            resizeCanvas();
        }

        function updateStatusBanner(text) {
            document.getElementById('status-banner').textContent = text;
        }

        function generateSwapQueue() {
            const config = LEVEL_CONFIGS[currentLevel];
            const queue = [];
            let lastA = -1, lastB = -1;

            for (let i = 0; i < config.swaps; i++) {
                let idxA, idxB;
                do {
                    idxA = Math.floor(Math.random() * config.cups);
                    idxB = Math.floor(Math.random() * config.cups);
                } while (idxA === idxB || (idxA === lastA && idxB === lastB) || (idxA === lastB && idxB === lastA));

                lastA = idxA;
                lastB = idxB;
                queue.push([idxA, idxB]);
            }
            return queue;
        }

        function startGame() {
            if (gameState !== 'IDLE') return;

            sounds.init();
            gameState = 'SHOWING';
            document.getElementById('start-btn').disabled = true;
            document.getElementById('start-btn').classList.add('opacity-50', 'cursor-not-allowed');

            updateStatusBanner('¡Memoriza la posición de la piedra!');

            // Animación: Levantamos el vaso con la piedra
            const targetCup = cups[stoneIndex];
            sounds.playLift();

            let startTime = null;
            const liftDuration = 600;
            const holdDuration = 1000;

            function animateLift(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (elapsed < liftDuration) {
                    // Subiendo vaso
                    targetCup.liftY = (elapsed / liftDuration) * 80;
                    requestAnimationFrame(animateLift);
                } else if (elapsed < liftDuration + holdDuration) {
                    // Mantener arriba
                    targetCup.liftY = 80;
                    requestAnimationFrame(animateLift);
                } else if (elapsed < liftDuration * 2 + holdDuration) {
                    // Bajando vaso
                    const dropProgress = (elapsed - liftDuration - holdDuration) / liftDuration;
                    targetCup.liftY = 80 * (1 - dropProgress);
                    requestAnimationFrame(animateLift);
                } else {
                    targetCup.liftY = 0;
                    // Comenzar mezcla inmediatamente
                    startShuffle();
                }
            }

            requestAnimationFrame(animateLift);
        }

        // Preparar e iniciar la fase de intercambio / Shuffle
        function startShuffle() {
            gameState = 'SHUFFLING';
            updateStatusBanner('¡Sigue el vaso con la mirada! Mezclando...');
            swapQueue = generateSwapQueue();
            executeNextSwap();
        }

        function executeNextSwap() {
            if (swapQueue.length === 0) {
                // Finalizó el shuffling
                gameState = 'GUESSING';
                updateStatusBanner('¡¿Dónde está la piedra?! Haz clic sobre un vaso');
                return;
            }

            const [idxA, idxB] = swapQueue.shift();
            const cupA = cups[idxA];
            const cupB = cups[idxB];
            const config = LEVEL_CONFIGS[currentLevel];

            // Si intercambio involucra al vaso con la piedra, actualizar el índice
            if (stoneIndex === idxA) stoneIndex = idxB;
            else if (stoneIndex === idxB) stoneIndex = idxA;

            // Reorganizar el array de objetos en Javascript para mantener concordancia
            cups[idxA] = cupB;
            cups[idxB] = cupA;

            sounds.playSwap();

            activeSwap = {
                cupA: cupA,
                cupB: cupB,
                startX_A: cupA.x,
                startX_B: cupB.x,
                targetX_A: slotPositions[idxB],
                targetX_B: slotPositions[idxA],
                startTime: performance.now(),
                duration: config.speed
            };

            requestAnimationFrame(animateSwapStep);
        }

        function animateSwapStep(now) {
            if (!activeSwap) return;

            const elapsed = now - activeSwap.startTime;
            const progress = Math.min(elapsed / activeSwap.duration, 1.0);

            // Función de atenuación suave (Easing function: Smoothstep / Sine)
            const ease = 0.5 - Math.cos(progress * Math.PI) / 2;

            // Trayectoria Horizontal
            activeSwap.cupA.x = activeSwap.startX_A + (activeSwap.targetX_A - activeSwap.startX_A) * ease;
            activeSwap.cupB.x = activeSwap.startX_B + (activeSwap.targetX_B - activeSwap.startX_B) * ease;

            // Arqueado Vertical para simular cruce en 3D (Uno pasa por delante/arriba y otro por atrás/abajo)
            const arcHeight = 35 * Math.sin(progress * Math.PI);
            activeSwap.cupA.y = (canvas.height * 0.62) - arcHeight;
            activeSwap.cupB.y = (canvas.height * 0.62) + (arcHeight * 0.6);

            if (progress < 1.0) {
                requestAnimationFrame(animateSwapStep);
            } else {
                // Final de este swap individual
                activeSwap.cupA.x = activeSwap.targetX_A;
                activeSwap.cupB.x = activeSwap.targetX_B;
                activeSwap.cupA.y = canvas.height * 0.62;
                activeSwap.cupB.y = canvas.height * 0.62;
                activeSwap = null;

                // Continuar con el siguiente intercambio
                executeNextSwap();
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar la piedra en la posición del vaso correspondiente (solo se ve si el vaso está levantado)
            if (cups[stoneIndex]) {
                drawStone(cups[stoneIndex].x, cups[stoneIndex].y, canvas.width);
            }

            // Dibujar todos los vasos
            cups.forEach(cup => cup.draw(ctx, canvas.width, canvas.height));

            requestAnimationFrame(render);
        }

        function handleCanvasClick(e) {
            if (gameState !== 'GUESSING') return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Detectar en qué vaso se hizo clic
            for (let i = 0; i < cups.length; i++) {
                const bounds = cups[i].getBounds(canvas.width);
                if (clickX >= bounds.left && clickX <= bounds.right && clickY >= bounds.top && clickY <= bounds.bottom) {
                    processGuess(i);
                    break;
                }
            }
        }

        function processGuess(selectedIndex) {
            gameState = 'RESULT';
            sounds.init();

            const isCorrect = (selectedIndex === stoneIndex);
            const selectedCup = cups[selectedIndex];
            const realStoneCup = cups[stoneIndex];

            sounds.playLift();

            // Elevar el vaso seleccionado
            let startTime = null;
            function animateReveal(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (elapsed < 500) {
                    selectedCup.liftY = (elapsed / 500) * 80;
                    if (!isCorrect && elapsed > 250) {
                        // Si falló, también destapar gradualmente el correcto para mostrar dónde estaba
                        realStoneCup.liftY = ((elapsed - 250) / 250) * 80;
                    }
                    requestAnimationFrame(animateReveal);
                } else {
                    selectedCup.liftY = 80;
                    if (!isCorrect) realStoneCup.liftY = 80;
                    showResultModal(isCorrect);
                }
            }

            requestAnimationFrame(animateReveal);
        }

        function showResultModal(isWin) {
            const modal = document.getElementById('result-modal');
            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            const successIcon = document.getElementById('success-icon');
            const failIcon = document.getElementById('fail-icon');
            const iconContainer = document.getElementById('modal-icon-container');
            const nextBtn = document.getElementById('next-btn');

            modal.classList.remove('hidden');

            if (isWin) {
                sounds.playWin();
                title.textContent = "¡Excelente Vista!";
                title.className = "text-2xl sm:text-3xl font-extrabold text-emerald-400 mb-2";
                desc.textContent = `¡Adivinaste correctamente en el Nivel ${currentLevel}!`;
                
                successIcon.classList.remove('hidden');
                failIcon.classList.add('hidden');
                iconContainer.className = "mb-3 p-4 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40";

                streak++;
                if (streak > bestStreak) bestStreak = streak;

                if (currentLevel < 5) {
                    nextBtn.classList.remove('hidden');
                } else {
                    nextBtn.classList.add('hidden');
                    desc.textContent = "¡Increíble! Has superado el Nivel 5 Maestro. ¡Eres imparable!";
                }
            } else {
                sounds.playLose();
                title.textContent = "¡Piedra Perdida!";
                title.className = "text-2xl sm:text-3xl font-extrabold text-rose-400 mb-2";
                desc.textContent = "Te has distraído un segundo. ¡Inténtalo de nuevo!";
                
                successIcon.classList.add('hidden');
                failIcon.classList.remove('hidden');
                iconContainer.className = "mb-3 p-4 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/40";

                streak = 0;
                nextBtn.classList.add('hidden');
            }

            document.getElementById('streak-count').textContent = streak;
            document.getElementById('best-streak').textContent = bestStreak;
        }

        window.addEventListener('resize', resizeCanvas);
        canvas.addEventListener('click', handleCanvasClick);

        document.getElementById('start-btn').addEventListener('click', startGame);

        document.getElementById('retry-btn').addEventListener('click', () => {
            initLevel(currentLevel);
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentLevel < 5) {
                initLevel(currentLevel + 1);
            }
        });

        // Selector de Niveles
        document.querySelectorAll('.level-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (gameState === 'SHUFFLING' || gameState === 'SHOWING') return;
                const targetLevel = parseInt(e.currentTarget.dataset.level);
                initLevel(targetLevel);
            });
        });

        // Toggle Sonido
        document.getElementById('sound-btn').addEventListener('click', () => {
            sounds.muted = !sounds.muted;
            document.getElementById('sound-icon-on').classList.toggle('hidden', sounds.muted);
            document.getElementById('sound-icon-off').classList.toggle('hidden', !sounds.muted);
        });

        // Arranque inicial
        window.onload = () => {
            initLevel(1);
            requestAnimationFrame(render);
        };
    </script>
</body>
</html>
